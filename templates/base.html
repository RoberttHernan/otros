<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>{% block titulo %}Taller Web{% endblock %}</title>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            min-height: 100vh;
        }

        /* NAV */
        nav {
            background: linear-gradient(135deg, #1a4a8a 0%, #2563eb 100%);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
        }
        .nav-brand {
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .nav-links a.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* LAYOUT */
        main {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* CARD */
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
        }

        /* PAGE HEADER */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a202c;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: filter 0.15s, transform 0.1s;
        }
        .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger  { background: #ef4444; color: white; }
        .btn-secondary { background: #e2e8f0; color: #4a5568; }

        /* TABLE */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead tr { border-bottom: 2px solid #e2e8f0; }
        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #718096;
        }
        td {
            padding: 14px 16px;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f4f8;
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f7faff; }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }

        /* FORM */
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        input[type='text'], textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #1a202c;
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
            background: #fafafa;
        }
        input[type='text']:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
            background: white;
        }
        textarea { resize: vertical; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: 1rem; margin-bottom: 20px; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href='/' class='nav-brand'>&#10003; Gestor de Tareas</a>
        <div class='nav-links'>
            <a href='/'>Inicio</a>
            <a href='/agregar'>+ Nueva Tarea</a>
        </div>
    </nav>

    <main>
        {% block contenido %}{% endblock %}
    </main>

    <footer>
        <p>Taller Desarrollo Web con Python</p>
    </footer>
</body>
</html>
