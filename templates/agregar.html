{% extends 'base.html' %}

{% block titulo %}Nueva Tarea{% endblock %}

{% block contenido %}
    <div class='page-header'>
        <h1>Nueva Tarea</h1>
    </div>

    <div class='card' style='max-width: 560px;'>
        <form method='POST' action='/agregar'>
            <div class='form-group'>
                <label for='titulo'>Título <span style='color:#ef4444;'>*</span></label>
                <input type='text' id='titulo' name='titulo'
                       required placeholder='Escribe el título de la tarea...'>
            </div>

            <div class='form-group'>
                <label for='descripcion'>Descripción <span style='color:#a0aec0; font-weight:400;'>(opcional)</span></label>
                <textarea id='descripcion' name='descripcion' rows='4'
                          placeholder='Agrega más detalles si lo necesitas...'></textarea>
            </div>

            <div style='display:flex; gap:10px; margin-top:8px;'>
                <button type='submit' class='btn btn-primary'>Guardar Tarea</button>
                <a href='/' class='btn btn-secondary'>Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
